## AnimeWatcherPlus server behind SWAG (linuxserver.io)
## Copy to /config/nginx/proxy-confs/ in SWAG and restart SWAG.
## Reachable as https://animewatcherplus.<your domain>.
##
## Only for access from the internet -- in the LAN, devices connect to the
## container directly (port 8784). Only the API is proxied: never add the
## pairing port 8785 here, new devices must stay pairable from the LAN only.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name animewatcherplus.*;

    include /config/nginx/ssl.conf;

    # Moving a library to the server only works from the LAN (pairing
    # port), so nothing big comes through here.
    client_max_body_size 16m;

    location / {
        include /config/nginx/proxy.conf;   # also sets the WebSocket upgrade headers
        include /config/nginx/resolver.conf;
        set $upstream_app animewatcherplus;
        set $upstream_port 8784;
        # The container speaks HTTPS itself (its own certificate, which the
        # apps pin in the LAN); nginx doesn't verify upstream certificates
        # by default, so the self-signed one is fine here.
        set $upstream_proto https;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
