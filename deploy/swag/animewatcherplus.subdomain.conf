## AnimeWatcherPlus server behind SWAG (linuxserver.io)
## Copy to /config/nginx/proxy-confs/ in SWAG and restart SWAG.
## Reachable as https://animewatcherplus.<your domain>.
##
## Only the API (port 8000) is proxied. Never add the pairing port 8001
## here -- new devices must stay pairable from the local network only.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name animewatcherplus.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 512m;  # database import when switching to the server

    location / {
        include /config/nginx/proxy.conf;   # also sets the WebSocket upgrade headers
        include /config/nginx/resolver.conf;
        set $upstream_app animewatcherplus;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
