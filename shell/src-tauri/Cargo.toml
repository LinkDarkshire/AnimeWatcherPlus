[package]
name = "app"
version = "0.3.3"
description = "AnimeWatcherPlus desktop and Android shell"
authors = ["LinkDarkshire"]
license = ""
repository = "https://github.com/LinkDarkshire/AnimeWatcherPlus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
rand = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }

# Desktop only: the bundled core (sidecar), the auto-updater and the OS keyring.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# Phones: scanning the pairing QR code.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
