name: Release

# Builds the Windows installer and the Linux AppImage when a version tag is
# pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`) and attaches both,
# with their updater signatures and latest.json, to a draft GitHub release --
# plus the Android APK and the server's Docker image (jobs below).
# Check the draft, then publish it -- only published releases reach the
# auto-updater.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the content of the
# updater key file) and, if the key has one, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            core_built: core.exe
            core_sidecar: core-x86_64-pc-windows-msvc.exe
          # The oldest supported Ubuntu on purpose: an AppImage runs on systems
          # with the same or a newer glibc than the one it was built on.
          - os: ubuntu-22.04
            bundles: appimage
            core_built: core
            core_sidecar: core-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle the Python core (PyInstaller)
        working-directory: core
        shell: bash
        run: |
          pip install -e ".[build]"
          pyinstaller core.spec --distpath ../shell/src-tauri/binaries --noconfirm
          mv ../shell/src-tauri/binaries/${{ matrix.core_built }} ../shell/src-tauri/binaries/${{ matrix.core_sidecar }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shell/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: shell/ui
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri -> target

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: shell
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }}
          # __VERSION__ is the app version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: AnimeWatcherPlus v__VERSION__
          releaseBody: "Windows: run the setup .exe. Linux: download the .AppImage, make it executable and start it. What's new: see the README."
          releaseDraft: true
          prerelease: false

  # The Android app (server connection only), signed with the release
  # keystore and attached to the same draft release. Needs the secrets
  # ANDROID_KEYSTORE_BASE64 (`base64 -w0 awp-release.jks`),
  # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS; skipped without them.
  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret -- skipping the Android build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.present == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build the signed APK
        if: steps.key.outputs.present == 'true'
        working-directory: shell
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > src-tauri/gen/android/keystore.properties
          npm ci
          npm --prefix ui ci
          npm run tauri -- android build --apk --target aarch64 armv7

      - name: Attach to the draft release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c 'import json;print(json.load(open("shell/src-tauri/tauri.conf.json"))["version"])')
          cp shell/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "AnimeWatcherPlus_${version}_android.apk"
          gh release upload "v${version}" "AnimeWatcherPlus_${version}_android.apk" --clobber

  # The server image (core in server mode) for Docker, e.g. on a NAS:
  # ghcr.io/<owner>/animewatcherplus-server:<version> and :latest
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          # The registry only accepts lowercase names.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/animewatcherplus-server" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+)\"", open("core/app/__init__.py").read())[1])')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: core
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
