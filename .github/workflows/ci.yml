name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports
      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shell/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type-check
        run: npx tsc -b
      - name: Test (vitest)
        run: npm run test

  tauri-check:
    # Windows too: the TLS stack (aws-lc) compiles C code, which is where
    # platform differences show.
    name: Tauri shell (cargo check, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sidecar: core-x86_64-unknown-linux-gnu
          - os: windows-latest
            sidecar: core-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shell/src-tauri
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Create placeholder sidecar binary
        # bundle.externalBin in tauri.conf.json makes tauri-build require this
        # exact path to exist for *any* cargo build/check, on every target
        # triple. `cargo check` never executes the binary, it only needs the
        # path to resolve, so an empty placeholder is enough (the real one
        # is built with PyInstaller in the release workflow).
        run: |
          mkdir -p binaries
          touch binaries/${{ matrix.sidecar }}
          chmod +x binaries/${{ matrix.sidecar }}
      - name: cargo check
        run: cargo check
      - name: cargo test
        run: cargo test
